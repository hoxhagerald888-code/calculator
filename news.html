<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forex News Calendar</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050b14;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    color:#9ca3af;
    margin-top:8px;
}

.clock{
    background:#0b1422;
    border:1px solid #1d2b3d;
    border-radius:12px;
    padding:12px;
    text-align:center;
    margin-bottom:20px;
}

#time{
    font-size:24px;
    font-weight:bold;
}

#date{
    color:#9ca3af;
    margin-top:4px;
}

.back-btn{
    display:block;
    text-decoration:none;
    text-align:center;
    background:#111c2c;
    color:white;
    border:1px solid #26364d;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
}

.back-btn:hover{
    background:#17243a;
}

.status{
    text-align:center;
    color:#9ca3af;
    margin-bottom:15px;
}

.event{
    background:#0b1422;
    border:1px solid #26364d;
    border-left:5px solid #ef4444;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
}

.event.today{
    border-left-color:#ff1f1f;
}

.event-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.currency{
    font-size:13px;
    font-weight:bold;
    background:#18263a;
    padding:6px 9px;
    border-radius:6px;
}

.red{
    background:#ef4444;
    color:white;
    padding:5px 9px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
}

.event-title{
    font-size:18px;
    font-weight:bold;
    margin:12px 0;
}

.event-time{
    color:#f87171;
    font-size:17px;
    font-weight:bold;
}

.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}

.detail{
    background:#111c2c;
    padding:10px;
    border-radius:8px;
    text-align:center;
}

.detail span{
    display:block;
    color:#8b98aa;
    font-size:12px;
    margin-bottom:4px;
}

.detail strong{
    font-size:14px;
}

.countdown{
    margin-top:12px;
    color:#fbbf24;
    font-weight:bold;
}

.no-events{
    text-align:center;
    padding:30px;
    background:#0b1422;
    border-radius:12px;
    color:#9ca3af;
}

.refresh{
    text-align:center;
    color:#66758a;
    font-size:12px;
    margin-top:20px;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .header h1{
        font-size:23px;
    }

    .details{
        grid-template-columns:1fr;
    }

    .event-title{
        font-size:16px;
    }

    #time{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚨 Forex Red Flag News</h1>
        <p>High Impact Economic Calendar</p>
    </div>

    <div class="clock">
        <div id="time">--:--:--</div>
        <div id="date">--</div>
    </div>

    <a href="index.html" class="back-btn">
        ← KTHEHU TE CALCULATOR
    </a>

    <div id="status" class="status">
        Duke ngarkuar lajmet...
    </div>

    <div id="events"></div>

    <div class="refresh">
        Përditësimi automatik çdo 15 minuta
    </div>

</div>

<script>

const FEED_URL =
"https://nfs.faireconomy.media/ff_calendar_thisweek.json";

const currencies = [
    "USD",
    "EUR",
    "GBP",
    "JPY",
    "CAD",
    "AUD",
    "CHF"
];

let eventsData = [];


/* =========================
   ORA SHQIPERI
========================= */

function updateClock(){

    const now = new Date();

    const time = new Intl.DateTimeFormat(
        "sq-AL",
        {
            timeZone:"Europe/Tirane",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }
    ).format(now);

    const date = new Intl.DateTimeFormat(
        "sq-AL",
        {
            timeZone:"Europe/Tirane",
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    ).format(now);

    document.getElementById("time").textContent = time;
    document.getElementById("date").textContent = date;
}

setInterval(updateClock,1000);
updateClock();


/* =========================
   TIMEZONE CONVERSION
========================= */

function tiranaDate(dateString){

    return new Date(
        new Date(dateString).toLocaleString(
            "en-US",
            {
                timeZone:"Europe/Tirane"
            }
        )
    );
}


function formatTime(date){

    return new Intl.DateTimeFormat(
        "sq-AL",
        {
            timeZone:"Europe/Tirane",
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        }
    ).format(date);
}


function formatDate(date){

    return new Intl.DateTimeFormat(
        "sq-AL",
        {
            timeZone:"Europe/Tirane",
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    ).format(date);
}


/* =========================
   LOAD NEWS
========================= */

async function loadNews(){

    const status =
        document.getElementById("status");

    const container =
        document.getElementById("events");

    status.textContent =
        "🔄 Duke përditësuar kalendarin...";

    try{

        const response =
            await fetch(
                FEED_URL +
                "?t=" +
                Date.now()
            );

        if(!response.ok){
            throw new Error("Feed error");
        }

        const data =
            await response.json();

        eventsData = data
            .filter(event =>
                event.impact === "High" &&
                currencies.includes(event.country)
            )
            .map(event => {

                return {
                    ...event,
                    localDate:
                        new Date(event.date)
                };

            })
            .sort(
                (a,b) =>
                a.localDate - b.localDate
            );

        renderEvents();

        const now =
            new Date();

        status.textContent =
            "🟢 Përditësuar: " +
            new Intl.DateTimeFormat(
                "sq-AL",
                {
                    timeZone:"Europe/Tirane",
                    hour:"2-digit",
                    minute:"2-digit"
                }
            ).format(now);

    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Nuk u arrit të ngarkohej kalendari.";

        container.innerHTML = `
            <div class="no-events">
                Kontrollo lidhjen me internetin dhe provo përsëri.
            </div>
        `;
    }
}


/* =========================
   RENDER EVENTS
========================= */

function renderEvents(){

    const container =
        document.getElementById("events");

    container.innerHTML = "";

    if(eventsData.length === 0){

        container.innerHTML = `
            <div class="no-events">
                ✅ Nuk ka lajme High Impact të planifikuara.
            </div>
        `;

        return;
    }

    const now = new Date();

    eventsData.forEach(event => {

        const eventDate =
            new Date(event.date);

        const localTime =
            formatTime(eventDate);

        const localDate =
            formatDate(eventDate);

        const isToday =
            new Intl.DateTimeFormat(
                "en-CA",
                {
                    timeZone:"Europe/Tirane"
                }
            ).format(eventDate)
            ===
            new Intl.DateTimeFormat(
                "en-CA",
                {
                    timeZone:"Europe/Tirane"
                }
            ).format(now);

        const div =
            document.createElement("div");

        div.className =
            "event" +
            (isToday ? " today" : "");

        div.innerHTML = `

            <div class="event-top">

                <span class="currency">
                    ${event.country}
                </span>

                <span class="red">
                    🔴 HIGH IMPACT
                </span>

            </div>

            <div class="event-title">
                ${event.title}
            </div>

            <div class="event-time">
                🕐 ${localTime}
                &nbsp;&nbsp;
                📅 ${localDate}
            </div>

            <div class="details">

                <div class="detail">
                    <span>Forecast</span>
                    <strong>
                        ${event.forecast || "-"}
                    </strong>
                </div>

                <div class="detail">
                    <span>Previous</span>
                    <strong>
                        ${event.previous || "-"}
                    </strong>
                </div>

                <div class="detail">
                    <span>Actual</span>
                    <strong>
                        ${event.actual || "-"}
                    </strong>
                </div>

            </div>

            <div
                class="countdown"
                data-date="${event.date}"
            >
                ⏳ duke llogaritur...
            </div>
        `;

        container.appendChild(div);

    });

    updateCountdowns();
}


/* =========================
   COUNTDOWN
========================= */

function updateCountdowns(){

    const elements =
        document.querySelectorAll(
            ".countdown"
        );

    const now =
        new Date();

    elements.forEach(element => {

        const eventDate =
            new Date(
                element.dataset.date
            );

        let diff =
            eventDate - now;

        if(diff <= 0){

            element.textContent =
                "🔴 EVENTI KA FILLUAR / KA KALUAR";

            return;
        }

        const totalSeconds =
            Math.floor(diff / 1000);

        const days =
            Math.floor(
                totalSeconds / 86400
            );

        const hours =
            Math.floor(
                (totalSeconds % 86400) / 3600
            );

        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );

        const seconds =
            totalSeconds % 60;

        let text = "⏳ ";

        if(days > 0){
            text += days + "d ";
        }

        text +=
            String(hours).padStart(2,"0") +
            ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            String(seconds).padStart(2,"0");

        element.textContent = text;

    });
}


/* =========================
   INITIAL LOAD
========================= */

loadNews();


/* Përditësim çdo 15 minuta */

setInterval(
    loadNews,
    15 * 60 * 1000
);


/* Countdown çdo sekondë */

setInterval(
    updateCountdowns,
    1000
);

</script>

</body>
</html>
