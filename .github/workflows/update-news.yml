name: Update Forex News Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest Forex calendar
        run: |
          curl -L "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            -o news.json

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to news.json"
          else
            git commit -m "Update Forex news calendar"
            git push
          fi
