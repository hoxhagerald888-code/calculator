<!DOCTYPE html>
<html lang="sq">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>Forex Daily Agenda</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at top,
            #182438 0%,
            #0b1018 48%,
            #080c12 100%
        );
    color: #f4f7fb;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 680px;
    margin: auto;
    padding: 24px 16px 35px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #6eaefc;
    text-transform: uppercase;
    margin-bottom: 7px;
}

.title {
    font-size: 31px;
    font-weight: 850;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 6px;
    color: #8996a8;
    font-size: 13px;
}

/* CLOCK */

.clock {
    padding: 22px 18px;
    border-radius: 22px;
    background:
        linear-gradient(
            145deg,
            #151e2b,
            #0f1621
        );
    border: 1px solid #29384c;
    box-shadow:
        0 14px 35px rgba(0,0,0,.28);
    text-align: center;
    margin-bottom: 18px;
}

.clock-time {
    font-size: 42px;
    line-height: 1;
    font-weight: 850;
    letter-spacing: 1px;
}

.clock-date {
    margin-top: 9px;
    color: #8f9bad;
    font-size: 13px;
    text-transform: capitalize;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
    padding: 8px 13px;
    border-radius: 30px;
    background: #1d2b3d;
    border: 1px solid #30445e;
    color: #dce9f8;
    font-size: 12px;
    font-weight: 750;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4da3ff;
    box-shadow: 0 0 10px #4da3ff;
}

/* SESSION CARDS */

.sessions {
    display: grid;
    gap: 13px;
}

.session-card {
    position: relative;
    padding: 18px;
    border-radius: 20px;
    background:
        linear-gradient(
            145deg,
            #131c28,
            #0f1620
        );
    border: 1px solid #273649;
    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.session-card.active {
    border-color: #4da3ff;

    box-shadow:
        0 0 0 1px rgba(77,163,255,.12),
        0 12px 30px rgba(0,0,0,.3);

    transform: translateY(-1px);
}

.session-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
}

.session-name {
    font-size: 20px;
    font-weight: 850;
    letter-spacing: -.3px;
}

.session-time {
    margin-top: 5px;
    color: #8997aa;
    font-size: 13px;
    font-weight: 600;
}

.active-badge {
    padding: 6px 10px;
    border-radius: 20px;
    background: #243449;
    color: #9daec3;
    font-size: 10px;
    font-weight: 800;
    white-space: nowrap;
}

.session-card.active .active-badge {
    background: #4da3ff;
    color: #06111d;
}

/* PAIRS */

.pair-label {
    margin-top: 17px;
    color: #69788c;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

.pairs {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 8px;
}

.pair {
    padding: 7px 10px;
    border-radius: 9px;
    background: #1c2735;
    border: 1px solid #2d3d51;
    color: #e8eef6;
    font-size: 12px;
    font-weight: 750;
}

/* OVERLAP */

.overlap {
    background:
        linear-gradient(
            145deg,
            #182436,
            #111a27
        );

    border-color: #36516e;
}

.overlap .pair {
    background: #202f42;
    border-color: #3a506b;
}

/* INFO */

.info {
    margin-top: 15px;
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(17,24,34,.8);
    border: 1px solid #202d3d;
    color: #788699;
    font-size: 11px;
    line-height: 1.55;
    text-align: center;
}

.info strong {
    color: #aebbd0;
}

/* MOBILE */

@media (max-width: 420px) {

    .container {
        padding:
            20px
            12px
            30px;
    }

    .title {
        font-size: 27px;
    }

    .clock-time {
        font-size: 36px;
    }

    .session-card {
        padding: 16px;
    }

    .session-name {
        font-size: 18px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            FOREX CONTROL CENTER
        </div>

        <div class="title">
            Daily Agenda
        </div>

        <div class="subtitle">
            8 instrumentet · Ora lokale e Shqipërisë 🇦🇱
        </div>

    </div>


    <!-- CLOCK -->

    <div class="clock">

        <div
            id="clock"
            class="clock-time">
            --:--:--
        </div>

        <div
            id="date"
            class="clock-date">
            --
        </div>

        <div
            id="status"
            class="status">

            <span class="status-dot"></span>

            <span id="statusText">
                Duke kontrolluar...
            </span>

        </div>

    </div>


    <!-- SESSION CARDS -->

    <div
        id="sessions"
        class="sessions">
    </div>


    <!-- INFO -->

    <div class="info">

        <strong>Orari</strong>

        llogaritet automatikisht sipas
        <strong>Europe/Tirane</strong>.

        Ndryshimet verore/dimërore
        llogariten automatikisht.

        <br><br>

        <strong>Pair-et:</strong>

        EURUSD · GBPUSD · USDJPY · XAUUSD ·
        AUDUSD · USDCAD · USDCHF · GBPJPY

    </div>

</div>


<script>

/* =====================================================
   TIMEZONE
===================================================== */

const ALBANIA_ZONE = "Europe/Tirane";


/* =====================================================
   SESSION DATA

   KËTU JANË 8 PAIR-ET E NDARA SIPAS SESIONEVE
===================================================== */

const SESSION_DATA = [

    {
        id: "asia",

        name: "🌏 ASIA / TOKYO",

        zone: "Asia/Tokyo",

        open: 9,

        close: 18,

        pairs: [
            "USDJPY",
            "AUDUSD",
            "GBPJPY"
        ]
    },


    {
        id: "london",

        name: "🇬🇧 LONDON",

        zone: "Europe/London",

        open: 8,

        close: 17,

        pairs: [
            "EURUSD",
            "GBPUSD",
            "GBPJPY",
            "USDCHF",
            "USDJPY"
        ]
    },


    {
        id: "newyork",

        name: "🇺🇸 NEW YORK",

        zone: "America/New_York",

        open: 8,

        close: 17,

        pairs: [
            "EURUSD",
            "GBPUSD",
            "USDJPY",
            "XAUUSD",
            "USDCAD",
            "USDCHF"
        ]
    }

];


/* =====================================================
   GET TIME PARTS
===================================================== */

function getParts(date, zone) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: zone,

                year: "numeric",
                month: "2-digit",
                day: "2-digit",

                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",

                hour12: false
            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(part => {

        result[part.type] =
            part.value;

    });


    return result;

}


/* =====================================================
   TIMEZONE OFFSET
===================================================== */

function getOffsetMinutes(
    date,
    zone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: zone,
                timeZoneName: "longOffset"
            }
        ).formatToParts(date);


    const zonePart =
        parts.find(
            p =>
                p.type ===
                "timeZoneName"
        );


    if (!zonePart) {
        return 0;
    }


    const match =
        zonePart.value.match(
            /GMT([+-])(\d{2})(?::?(\d{2}))?/
        );


    if (!match) {
        return 0;
    }


    const sign =
        match[1] === "-"
            ? -1
            : 1;


    const hours =
        Number(match[2]);


    const minutes =
        Number(match[3] || 0);


    return sign *
        (hours * 60 + minutes);

}


/* =====================================================
   LOCAL TIME → UTC
===================================================== */

function zonedTimeToUTC(

    year,
    month,
    day,
    hour,
    minute,
    zone

) {

    let guess =
        Date.UTC(
            year,
            month - 1,
            day,
            hour,
            minute,
            0
        );


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const offset =
            getOffsetMinutes(
                new Date(guess),
                zone
            );


        guess =
            Date.UTC(
                year,
                month - 1,
                day,
                hour,
                minute,
                0
            )
            -
            offset * 60000;

    }


    return new Date(guess);

}


/* =====================================================
   TODAY IN ALBANIA
===================================================== */

function getAlbaniaDate() {

    const p =
        getParts(
            new Date(),
            ALBANIA_ZONE
        );


    return {

        year: Number(p.year),

        month: Number(p.month),

        day: Number(p.day)

    };

}


/* =====================================================
   FORMAT ALBANIA TIME
===================================================== */

function formatAlbaniaTime(
    date,
    seconds = false
) {

    return new Intl.DateTimeFormat(
        "sq-AL",
        {

            timeZone:
                ALBANIA_ZONE,

            hour:
                "2-digit",

            minute:
                "2-digit",

            ...(seconds
                ? {
                    second:
                        "2-digit"
                }
                : {}),

            hour12:
                false

        }
    ).format(date);

}


/* =====================================================
   DATE
===================================================== */

function formatDate() {

    return new Intl.DateTimeFormat(
        "sq-AL",
        {

            timeZone:
                ALBANIA_ZONE,

            weekday:
                "long",

            day:
                "numeric",

            month:
                "long",

            year:
                "numeric"

        }
    ).format(
        new Date()
    );

}


/* =====================================================
   BUILD SESSION TIMES
===================================================== */

function buildSessions() {

    const d =
        getAlbaniaDate();


    return SESSION_DATA.map(
        session => {

            const start =
                zonedTimeToUTC(

                    d.year,
                    d.month,
                    d.day,

                    session.open,
                    0,

                    session.zone

                );


            const end =
                zonedTimeToUTC(

                    d.year,
                    d.month,
                    d.day,

                    session.close,
                    0,

                    session.zone

                );


            return {

                ...session,

                start,
                end

            };

        }
    );

}


/* =====================================================
   ACTIVE SESSIONS
===================================================== */

function getActiveSessions(
    sessions,
    now
) {

    return sessions.filter(
        session =>
            now >= session.start &&
            now < session.end
    );

}


/* =====================================================
   LONDON + NEW YORK OVERLAP
===================================================== */

function getOverlap(
    sessions
) {

    const london =
        sessions.find(
            s =>
                s.id ===
                "london"
        );


    const newYork =
        sessions.find(
            s =>
                s.id ===
                "newyork"
        );


    const start =
        new Date(
            Math.max(
                london.start.getTime(),
                newYork.start.getTime()
            )
        );


    const end =
        new Date(
            Math.min(
                london.end.getTime(),
                newYork.end.getTime()
            )
        );


    return {
        start,
        end
    };

}


/* =====================================================
   CURRENT STATUS
===================================================== */

function getCurrentStatus(
    active,
    now,
    overlap
) {

    if (
        now >= overlap.start &&
        now < overlap.end
    ) {

        return "🔥 LONDON + NEW YORK · OVERLAP";

    }


    if (
        active.length === 1
    ) {

        return active[0].name;

    }


    return "🌙 JASHTË SESIONEVE KRYESORE";

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(
    session,
    now
) {

    const isActive =
        now >= session.start &&
        now < session.end;


    return `

        <div class="session-card
            ${isActive ? "active" : ""}">

            <div class="session-top">

                <div>

                    <div class="session-name">

                        ${session.name}

                    </div>


                    <div class="session-time">

                        ${formatAlbaniaTime(
                            session.start
                        )}

                        –

                        ${formatAlbaniaTime(
                            session.end
                        )}

                        · Ora Shqipëri

                    </div>

                </div>


                <div class="active-badge">

                    ${
                        isActive
                        ? "TANI"
                        : "SESION"
                    }

                </div>

            </div>


            <div class="pair-label">

                Pair-et e sesionit

            </div>


            <div class="pairs">

                ${
                    session.pairs.map(

                        pair =>

                        `<span class="pair">
                            ${pair}
                        </span>`

                    ).join("")
                }

            </div>

        </div>

    `;

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const now =
        new Date();


    const sessions =
        buildSessions();


    const active =
        getActiveSessions(
            sessions,
            now
        );


    const overlap =
        getOverlap(
            sessions
        );


    /* CLOCK */

    document.getElementById(
        "clock"
    ).textContent =
        formatAlbaniaTime(
            now,
            true
        );


    document.getElementById(
        "date"
    ).textContent =
        formatDate();


    document.getElementById(
        "statusText"
    ).textContent =
        getCurrentStatus(
            active,
            now,
            overlap
        );


    /* CARDS */

    const container =
        document.getElementById(
            "sessions"
        );


    let html = "";


    /*
       ASIA
    */

    const asia =
        sessions.find(
            s =>
                s.id ===
                "asia"
        );


    html += createCard(
        asia,
        now
    );


    /*
       LONDON
    */

    const london =
        sessions.find(
            s =>
                s.id ===
                "london"
        );


    html += createCard(
        london,
        now
    );


    /*
       OVERLAP
    */

    const overlapPairs = [

        "EURUSD",
        "GBPUSD",
        "GBPJPY",
        "USDCHF",
        "USDJPY",
        "XAUUSD",
        "USDCAD"

    ];


    const overlapActive =
        now >= overlap.start &&
        now < overlap.end;


    html += `

        <div class="session-card overlap
            ${overlapActive ? "active" : ""}">

            <div class="session-top">

                <div>

                    <div class="session-name">

                        🔥 LONDON + NEW YORK

                    </div>


                    <div class="session-time">

                        ${formatAlbaniaTime(
                            overlap.start
                        )}

                        –

                        ${formatAlbaniaTime(
                            overlap.end
                        )}

                        · Ora Shqipëri

                    </div>

                </div>


                <div class="active-badge">

                    ${
                        overlapActive
                        ? "TANI"
                        : "OVERLAP"
                    }

                </div>

            </div>


            <div class="pair-label">

                Pair-et e sesionit

            </div>


            <div class="pairs">

                ${
                    overlapPairs.map(

                        pair =>

                        `<span class="pair">
                            ${pair}
                        </span>`

                    ).join("")
                }

            </div>

        </div>

    `;


    /*
       NEW YORK

       GBPJPY NUK ËSHTË KËTU
    */

    const newYork =
        sessions.find(
            s =>
                s.id ===
                "newyork"
        );


    html += createCard(
        newYork,
        now
    );


    container.innerHTML =
        html;

}


/* =====================================================
   START
===================================================== */

render();


setInterval(
    render,
    1000
);

</script>

</body>
</html>
